version: "3.9"

services:
  db:
    image: postgres:15
    container_name: hrms_db
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./hrms-backend
    container_name: hrms_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hrms
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: hrms_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend


volumes:
  postgres_data:
